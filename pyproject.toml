[project]
name = "inmet-fetcher"
version = "0.4.0"
description = "Coletor de dados meteorológicos do INMET-BDMEP"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "inmet",
    "bdmep",
    "weather",
    "meteorology",
    "brazil",
    "open-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.4.0",
    "quantilica-analytics>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/Quantilica/inmet-fetcher"
Repository = "https://github.com/Quantilica/inmet-fetcher"
Issues = "https://github.com/Quantilica/inmet-fetcher/issues"

[project.scripts]
inmet-fetcher = "inmet_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
inmet = "inmet_fetcher.plugin:app"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-httpx>=0.36.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/inmet_fetcher/fetch.py" = ["E501"]
"tests/*" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/inmet_fetcher"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

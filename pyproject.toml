[project]
name = "inmet-fetcher"
version = "0.7.1"
description = "Coletor de dados meteorológicos do INMET-BDMEP"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "inmet",
    "bdmep",
    "weather",
    "meteorology",
    "brazil",
    "open-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.19.0",
]

[project.optional-dependencies]
analysis = [
    "polars>=1.0.0",
    "quantilica-analytics>=0.5.0",
    "tqdm>=4.66.0",
    # data_hora em UTC: no Windows o Python não traz a base de fusos IANA.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Quantilica/inmet-fetcher"
Repository = "https://github.com/Quantilica/inmet-fetcher"
Issues = "https://github.com/Quantilica/inmet-fetcher/issues"

[project.scripts]
inmet-fetcher = "inmet_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
inmet = "inmet_fetcher.plugin:app"

[project.entry-points."quantilica.lake"]
inmet = "inmet_fetcher.lake:converter"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest-cov>=7.1",
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "quantilica-core[docs]>=0.19.0",
    # Só para os testes: tests/test_lake.py exercita o comando convert do plugin Typer,
    # que depende do host (quantilica-cli). Não são dependências do pacote.
    # Piso = 0.30.0, primeira versão que reconhece a marca ``pending_publication``
    # da entrada do catálogo (404 do ano corrente vira "ainda não publicado").
    "quantilica-cli>=0.30.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[tool.uv]
required-version = ">=0.9"

# Índices: o uv procura em ordem e para no primeiro que tem o pacote
# (index-strategy padrão first-index). O PyPI vem antes, então o índice
# Quantilica (GitHub Pages, que responde 503 intermitente a pacote que não
# hospeda) só é consultado para o que não está no PyPI (quantilica-analytics).
# Sem [tool.uv.sources]: no workspace do monorepo quantilica-analytics é membro
# e uma fonte de índice aqui quebraria o `uv run` da raiz.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[[tool.uv.index]]
name = "quantilica"
url = "https://index.quantilica.com/simple/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/inmet_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]

[tool.coverage.run]
source = ["inmet_fetcher"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
